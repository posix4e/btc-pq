[package]
name = "btc-pq-receipt-tool"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "btc_pq_receipt"
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode"] }

[profile.release]
debug = 1
lto = "thin"
