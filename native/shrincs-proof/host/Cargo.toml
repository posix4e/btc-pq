[package]
name = "btc-pq-shrincs-proof"
version = "0.1.0"
edition = "2021"

[features]
local = ["risc0-zkvm/prove"]

[dependencies]
anyhow = "1"
bincode = "1.3"
serde_json = "1"
hex = "0.4"
shrincs-proof-common = { path = "../common" }
shrincs-proof-methods = { path = "../methods" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode"] }
